name: Build ImmortalWrt MT798x

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to runner for custom configuration (tmate)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget ccache
          sudo timedatectl set-timezone "Asia/Hong_Kong"

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          # Remove ttyd and broken packages causing dependency warning
          rm -rf feeds/luci/applications/luci-app-radicale3
          rm -rf feeds/luci/applications/luci-app-ttyd
          rm -rf feeds/packages/utils/ttyd          
          ./scripts/feeds install -a

      - name: Generate default target config (.config)
        run: |
          if [ -f "defconfig/mt7986-ax6000.config" ]; then
            cp -f defconfig/mt7986-ax6000.config .config
          else
            echo "CONFIG_TARGET_mediatek=y" > .config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jdcloud_re-cp-03=y" >> .config
          fi

          # 2. Expand base configuration dependencies
          make defconfig

          # 3. Strip all zh-cn language packs and ttyd configurations from .config
          sed -i '/CONFIG_PACKAGE_luci-i18n-.*-zh-cn=y/d' .config
          sed -i '/CONFIG_PACKAGE_luci-app-ttyd=y/d' .config
          sed -i '/CONFIG_PACKAGE_ttyd=y/d' .config
          sed -i '/CONFIG_PACKAGE_luci-app-turboacc-mtk_INCLUDE_TTYD=y/d' .config
          
          # 4. Disable standard OpenWrt/LuCI language options
          echo "# CONFIG_LUCI_LANG_zh_Hans is not set" >> .config
          echo "# CONFIG_PACKAGE_luci-i18n-base-zh-cn is not set" >> .config          
          echo "# CONFIG_PACKAGE_luci-app-ttyd is not set" >> .config
          echo "# CONFIG_PACKAGE_ttyd is not set" >> .config          

          # 5. Final dependency resolution pass
          make defconfig
          
      - name: Setup SSH interactive config terminal (Optional)
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Download source packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          echo "Building on $(nproc) cores..."
          make -j$(nproc) || make -j1 V=s

      - name: Verify and organize firmware files
        run: |
          echo "=== List of compiled firmware files ==="
          # Locate generated output directory dynamically under bin/targets/
          TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1)
          echo "Found firmware directory: ${TARGET_DIR}"
          ls -la "${TARGET_DIR}/"
          
          # Prepare output directory for artifact upload
          mkdir -p /tmp/firmware
          cp -f ${TARGET_DIR}/*.bin /tmp/firmware/ 2>/dev/null || cp -f ${TARGET_DIR}/* /tmp/firmware/
          echo "FIRMWARE_PATH=/tmp/firmware" >> $GITHUB_ENV

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_MT798x_Firmware
          path: ${{ env.FIRMWARE_PATH }}/*
          retention-days: 7
