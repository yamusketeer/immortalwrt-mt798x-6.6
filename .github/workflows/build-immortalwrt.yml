name: Build ImmortalWrt MT798x

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to runner for custom configuration (tmate)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget ccache
          sudo timedatectl set-timezone "Asia/Hong_Kong"

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a    

          # 1. Patch TurboACC Makefile so it accepts dnsmasq-full instead of forcing standard dnsmasq
          if [ -f "package/mtk/applications/luci-app-turboacc-mtk/Makefile" ]; then
            sed -i 's/+dnsmasq/+dnsmasq-full/g' package/mtk/applications/luci-app-turboacc-mtk/Makefile
          fi
          
          # 1. Strip ttyd dependencies across ALL TurboACC Makefiles and Config.in files in the entire repo
          find package/ feeds/ -type f \( -name "Makefile" -o -name "Config.in" \) -exec sed -i \
            -e 's/+luci-app-ttyd//g' \
            -e 's/+ttyd//g' \
            -e '/luci-app-ttyd/d' \
            -e '/package-ttyd/d' {} +            
          # 2. Remove ttyd and broken packages causing dependency warning
          rm -rf feeds/luci/applications/luci-app-radicale3
          rm -rf feeds/luci/applications/luci-app-ttyd
          rm -rf feeds/packages/utils/ttyd          
          ./scripts/feeds install -a

      - name: Generate default target config (.config)
        run: |
          # 1. Base Configuration Setup        
          if [ -f "defconfig/mt7986-ax6000.config" ]; then
            cp -f defconfig/mt7986-ax6000.config .config
          else
            echo "CONFIG_TARGET_mediatek=y" > .config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jdcloud_re-cp-03=y" >> .config
          fi

          # 2. Expand base configuration dependencies
          make defconfig

          # 3. Strip all zh-cn language packages and ttyd lines completely from .config
          sed -i '/-zh-cn/d' .config
          sed -i '/ttyd/d' .config
          
          # 4. Force-replace standard dnsmasq with dnsmasq-full and set WireGuard
          cat <<EOF >> .config
          # DISABLE standard dnsmasq and unwanted apps
          CONFIG_PACKAGE_dnsmasq=n
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_ttyd=n
          # CONFIG_PACKAGE_ttyd is not set
          CONFIG_PACKAGE_luci-app-ttyd=n
          # CONFIG_PACKAGE_luci-app-ttyd is not set
          # CONFIG_LUCI_LANG_zh_Hans is not set
          # CONFIG_PACKAGE_luci-app-turboacc-mtk_INCLUDE_TTYD is not set

          # ENABLE dnsmasq-full and dependencies
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_dhcp=y
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_dnsmasq_full_dnssec=y
          CONFIG_PACKAGE_dnsmasq_full_auth=y
          CONFIG_PACKAGE_dnsmasq_full_ipset=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y
          CONFIG_PACKAGE_dnsmasq_full_conntrack=y

          # ENABLE WireGuard
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          EOF

          # 5. Resolve dependencies (make defconfig will honor the explicit dnsmasq-full selection)
          make defconfig

          # 6. Final safety sweep to ensure standard dnsmasq wasn't re-inserted
          sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          make defconfig
          
      - name: Setup SSH interactive config terminal (Optional)
        if: ${{ github.event.inputs.ssh == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Download source packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          echo "Building on $(nproc) cores..."
          make -j$(nproc) || make -j1 V=s

      - name: Verify and organize firmware files
        run: |
          echo "=== List of compiled firmware files ==="
          # Locate generated output directory dynamically under bin/targets/
          TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1)
          echo "Found firmware directory: ${TARGET_DIR}"
          ls -la "${TARGET_DIR}/"
          
          # Prepare output directory for artifact upload
          mkdir -p /tmp/firmware
          cp -f ${TARGET_DIR}/*.bin /tmp/firmware/ 2>/dev/null || cp -f ${TARGET_DIR}/* /tmp/firmware/
          echo "FIRMWARE_PATH=/tmp/firmware" >> $GITHUB_ENV

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_MT798x_Firmware
          path: ${{ env.FIRMWARE_PATH }}/*
          retention-days: 7
